name: Test

on:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        go: ["1.26", "1.27"]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Render the example decks
        run: |
          go run . render example/presentation /tmp/presentation.html
          go run . render example/themes /tmp/themes.html
